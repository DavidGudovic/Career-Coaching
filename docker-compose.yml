# Production stack for Jelena's server.
# nginx on the host reverse-proxies to 127.0.0.1:3000 (app binds to localhost only).
#
# Content (DB rows + uploaded images) lives in named volumes — NOT in the image —
# so rebuilding/updating the app image never wipes her blog posts or photos.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: karijera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karijera}
      POSTGRES_DB: karijera
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U karijera -d karijera']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # In production the server PULLS this pre-built image from GHCR (built by CI on
    # merge to main) — it does not build. `build:` is kept for local dev convenience:
    # `docker compose build app` still works and tags the same image name.
    image: ghcr.io/davidgudovic/career-coaching:latest
    build:
      context: .
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?set your public URL in .env}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URI: postgres://karijera:${POSTGRES_PASSWORD:-karijera}@db:5432/karijera
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?set your public URL in .env}
      MEDIA_DIR: /app/media
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ANALYTICS_ENABLED: ${ANALYTICS_ENABLED:-false}
      ANALYTICS_TRUST_PROXY: ${ANALYTICS_TRUST_PROXY:-false}
      UMAMI_URL: ${UMAMI_URL:-http://umami:3000}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_USERNAME: ${UMAMI_USERNAME:-}
      UMAMI_PASSWORD: ${UMAMI_PASSWORD:-}
    ports:
      # Bind to localhost only; nginx terminates TLS and proxies in.
      - '127.0.0.1:3000:3000'
    volumes:
      - media-data:/app/media

  # Optional free analytics. Enable with COMPOSE_PROFILES=analytics in .env.
  # Its UI stays private on localhost; the CMS reads the API over the Docker network.
  umami:
    profiles: ['analytics']
    image: ghcr.io/umami-software/umami:3.3.1
    restart: unless-stopped
    init: true
    mem_limit: 768m
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_TWO_FACTOR_KEY:-}
      DISABLE_TELEMETRY: '1'
    ports:
      - '127.0.0.1:3002:3000'

  umami-db:
    profiles: ['analytics']
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: umami
      POSTGRES_DB: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-}
    volumes:
      - umami-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U umami -d umami']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-off seeding job. Uses the builder image (which has tsx + the seed script
  # + the assets/ photos) and the same DB/volume as the app.
  # Run once after first deploy:  docker compose --profile seed run --rm seed
  seed:
    profiles: ['seed']
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-https://jelena.rajkovic.coach}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URI: postgres://karijera:${POSTGRES_PASSWORD:-karijera}@db:5432/karijera
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      MEDIA_DIR: /app/media
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - media-data:/app/media
    command: ['node', '--import', 'tsx', 'src/seed/index.ts']

volumes:
  db-data:
  media-data:
  umami-data:
